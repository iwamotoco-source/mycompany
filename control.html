<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Atelier One · GitHub同期設定</title>
<style>
:root{color-scheme:dark;--bg:#070b10;--panel:#101821;--panel2:#0c131b;--text:#f5f7fa;--muted:#98a4b3;--line:#26313d;--blue:#0a84ff;--green:#30d158;--red:#ff453a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(180deg,#2997ff,#0071e3);display:grid;place-items:center;font-weight:800;color:#fff}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.back{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:600;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}.card h2{font-size:16px;margin:0 0 6px}.card p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 14px}.status{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.dot{width:9px;height:9px;border-radius:999px;background:#7b8794;margin-top:4px}.status.ok .dot{background:var(--green)}.status.bad .dot{background:var(--red)}.status strong{display:block;font-size:13px}.status small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
label{display:grid;gap:7px;font-size:12px;color:var(--muted);margin-top:12px}input{width:100%;border:1px solid var(--line);background:#091019;color:var(--text);border-radius:14px;padding:13px 14px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:11px 15px;font-weight:700;font-size:13px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:12px}.meta span:nth-child(odd){color:var(--muted)}.meta span:nth-child(even){overflow-wrap:anywhere}.hint{font-size:11px;color:var(--muted);margin-top:10px}.hidden{display:none!important}
@media(max-width:620px){.row{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:18px}.back{padding:9px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark">A1</div><div><h1>GitHub / Gist 同期設定</h1><p>Atelier One · MY COMPANY</p></div></div>
    <a class="back" href="./app.html?direct=1">MY COMPANYへ戻る</a>
  </div>

  <section class="card">
    <h2>Gist同期</h2>
    <p>GitHub Token と Gist ID をこの端末に保存します。Token はGist本文へ保存しません。</p>
    <div id="status" class="status"><span class="dot"></span><div><strong>未設定</strong><small>下の2項目を入力してください。</small></div></div>

    <label>GitHub Token
      <input id="token" type="password" autocomplete="off" placeholder="ghp_... / github_pat_...">
    </label>
    <label>Gist ID
      <input id="gistId" type="text" autocomplete="off" placeholder="Gist URLの最後の英数字">
    </label>
    <label>同期ファイル名
      <input id="gistFile" type="text" value="my-company-state.json">
    </label>

    <div class="buttons">
      <button class="btn primary" id="save">保存して接続テスト</button>
      <button class="btn" id="create">Gistを新規作成</button>
      <button class="btn" id="open">Gistを開く</button>
    </div>
  </section>

  <section class="card">
    <h2>同期操作</h2>
    <p>現在のMY COMPANYデータをGistへ保存、またはGistからこの端末へ復元します。</p>
    <div class="buttons">
      <button class="btn primary" id="push">この端末 → Cloud</button>
      <button class="btn" id="pull">Cloud → この端末</button>
    </div>
    <div class="meta" style="margin-top:16px">
      <span>端末ID</span><span id="device">-</span>
      <span>Gist ID</span><span id="gistText">-</span>
      <span>最終同期</span><span id="lastSync">-</span>
    </div>
  </section>

  <section class="card">
    <h2>安全設定</h2>
    <div class="buttons"><button class="btn danger" id="forget">この端末のGitHub Tokenを消去</button></div>
  </section>
</div>
<script>
(()=>{
'use strict';
const CFG='my-company-cloud-sync-v3', DB='my-company-portable-v1', STORE='state', KEY='company';
const $=id=>document.getElementById(id);
let cfg={token:'',gistId:'',gistFile:'my-company-state.json',deviceId:'',lastSyncAt:'',...safeParse(localStorage.getItem(CFG)||'{}')};
if(!cfg.deviceId) cfg.deviceId='dev-'+((crypto.randomUUID&&crypto.randomUUID())||Math.random().toString(36).slice(2)).slice(0,8);
function safeParse(s){try{return JSON.parse(s)}catch{return {}}}
function saveCfg(){localStorage.setItem(CFG,JSON.stringify(cfg));render();}
function render(){ $('token').value=cfg.token||''; $('gistId').value=cfg.gistId||''; $('gistFile').value=cfg.gistFile||'my-company-state.json'; $('device').textContent=cfg.deviceId||'-'; $('gistText').textContent=cfg.gistId||'-'; $('lastSync').textContent=cfg.lastSyncAt?new Date(cfg.lastSyncAt).toLocaleString('ja-JP'):'-'; }
function setStatus(type,title,detail){const el=$('status');el.className='status '+(type||'');el.querySelector('strong').textContent=title;el.querySelector('small').textContent=detail||''}
function readUi(){cfg.token=$('token').value.trim();cfg.gistId=$('gistId').value.trim();cfg.gistFile=$('gistFile').value.trim()||'my-company-state.json';saveCfg()}
function headers(json=false){if(!cfg.token)throw new Error('GitHub Tokenを入力してください');const h={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+cfg.token};if(json)h['Content-Type']='application/json';return h}
async function gh(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(!!opt.body),...(opt.headers||{})}});const t=await r.text();let d=t;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error(d&&d.message?d.message:'GitHub API '+r.status);return d}
async function db(){return await new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function readState(){const d=await db();return await new Promise((resolve,reject)=>{const tx=d.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(KEY);q.onsuccess=()=>resolve(q.result||{revision:0,projects:[],tasks:[],records:[],assets:[],notes:[],audit:[]});q.onerror=()=>reject(q.error)})}
async function writeState(state){const d=await db();await new Promise((resolve,reject)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function digest(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function payload(){const state=await readState(),txt=JSON.stringify(state);return {format:'my-company-cloud',version:2,savedAt:new Date().toISOString(),deviceId:cfg.deviceId,revision:Number(state.revision||0),sha256:await digest(txt),state}}
async function test(){readUi();if(!cfg.gistId)throw new Error('Gist IDを入力してください');await gh('https://api.github.com/gists/'+encodeURIComponent(cfg.gistId));cfg.lastSyncAt=new Date().toISOString();saveCfg();setStatus('ok','接続成功','GitHub Token と Gist ID を確認できました。')}
async function create(){readUi();const p=await payload();const d=await gh('https://api.github.com/gists',{method:'POST',body:JSON.stringify({description:'Atelier One / MY COMPANY Sync',public:true,files:{[cfg.gistFile]:{content:JSON.stringify(p)}}})});cfg.gistId=d.id;cfg.lastSyncAt=new Date().toISOString();saveCfg();setStatus('ok','Gistを作成しました','Gist IDをこの端末に保存しました。')}
async function push(){readUi();if(!cfg.gistId)throw new Error('Gist IDを入力してください');const p=await payload();await gh('https://api.github.com/gists/'+encodeURIComponent(cfg.gistId),{method:'PATCH',body:JSON.stringify({files:{[cfg.gistFile]:{content:JSON.stringify(p)}}})});cfg.lastSyncAt=new Date().toISOString();saveCfg();setStatus('ok','同期完了','この端末のデータをGistへ保存しました。')}
async function pull(){readUi();if(!cfg.gistId)throw new Error('Gist IDを入力してください');const d=await gh('https://api.github.com/gists/'+encodeURIComponent(cfg.gistId));const f=d.files&&d.files[cfg.gistFile];if(!f)throw new Error('同期ファイルがGist内にありません');let text=f.content||'';if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{headers:headers(false)});text=await r.text()}const p=JSON.parse(text);if(!p.state)throw new Error('MY COMPANY同期データではありません');await writeState(p.state);cfg.lastSyncAt=new Date().toISOString();saveCfg();setStatus('ok','復元完了','クラウドデータをこの端末へ反映しました。')}
async function run(fn){try{setStatus('','処理中','しばらくお待ちください。');await fn()}catch(e){setStatus('bad','エラー',e.message||String(e))}}
$('save').onclick=()=>run(test);$('create').onclick=()=>run(create);$('push').onclick=()=>run(push);$('pull').onclick=()=>run(pull);$('open').onclick=()=>{readUi();if(cfg.gistId)window.open('https://gist.github.com/'+cfg.gistId,'_blank','noopener');else setStatus('bad','未設定','Gist IDを入力してください。')};$('forget').onclick=()=>{cfg.token='';saveCfg();setStatus('','Tokenを消去しました','MY COMPANYデータは消えていません。')};
render(); if(cfg.token&&cfg.gistId)setStatus('ok','設定済み','接続テストを実行できます。');
})();
</script>
</body>
</html>
