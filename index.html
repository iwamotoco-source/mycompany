<style>html,body{margin:0;min-height:100%;background:#090f17;color:#e9eff6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}body{display:grid;place-items:center;min-height:100dvh}.boot{padding:28px;text-align:center}.boot strong{display:block;font-size:17px}.boot span{display:block;margin-top:8px;color:#8fa0b2;font-size:13px}.dot{display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#0a84ff;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}a{display:inline-block;margin-top:18px;color:#8fcaff}</style>

<body>
<div class="boot"><strong><i class="dot"></i>MY COMPANYを準備しています</strong><span>表示キャッシュを切り離しています…</span><a id="fallback" href="./stable-20260914.html?build=2" hidden>そのまま開く</a></div>
<script>
(async()=>{
  const target='./stable-20260914.html?build=2';
  const cleanup=(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}}catch(_){}})();
  await Promise.race([cleanup,new Promise(r=>setTimeout(r,700))]);
  location.replace(target);
  setTimeout(()=>{document.getElementById('fallback').hidden=false;},1800);
})();
</script>
<noscript><a href="./stable-20260914.html?build=2">MY COMPANYを開く</a></noscript>
