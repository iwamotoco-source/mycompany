<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f17"><title>MY COMPANY Repair</title><style>html,body{margin:0;min-height:100%;background:#090f17;color:#eef4fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}body{display:grid;place-items:center;min-height:100dvh}.box{max-width:420px;padding:28px;text-align:center}.box h1{font-size:20px}.box p{color:#91a0af;line-height:1.65}.box a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:999px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:700}</style></head><body><div class="box"><h1>MY COMPANYを修復しています</h1><p id="status">旧Service Workerとキャッシュを解除しています…</p><a id="fallback" href="./app.html?clean=20260914-2150" hidden>MY COMPANYを開く</a></div><script>(async()=>{const s=document.getElementById('status'),a=document.getElementById('fallback');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}s.textContent='修復完了。MY COMPANYを開きます…';await new Promise(r=>setTimeout(r,250));location.replace('./app.html?clean=20260914-2150');}catch(e){s.textContent='自動修復の一部に失敗しました。下のボタンから開いてください。';a.hidden=false;}})();</script></body></html>
